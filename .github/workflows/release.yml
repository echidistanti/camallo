name: Release

# Publishing a release builds everything on GitHub: camallo.exe for Windows (MSVC) from the tag, the portable
# camallo-<version>-windows-x64.7z attached to the release, and then the setup (see installer.yml). On Linux it
# builds camallo-<version>-linux-x86_64.AppImage and attaches that too.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.6.3)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Build camallo.exe
        run: cargo build --release --locked

      - name: Pack it and attach it to the release
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target\release\camallo.exe dist\
          Push-Location dist
          7z a "..\camallo-$version-windows-x64.7z" camallo.exe
          if ($LASTEXITCODE -ne 0) { throw "7z failed" }
          Pop-Location
          gh release upload $env:TAG "camallo-$version-windows-x64.7z" --repo $env:GITHUB_REPOSITORY --clobber

  appimage:
    # The oldest Ubuntu still offered: an AppImage runs on anything with a glibc at least as new as the one it was built on.
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Libraries of the browser window
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Build camallo and camallo-browser
        run: cargo build --release --locked

      - name: Pack the AppImage and attach it to the release
        run: |
          version="${TAG#v}"
          packaging/linux/build-appimage.sh "$version" target/release dist
          gh release upload "$TAG" "dist/camallo-$version-linux-x86_64.AppImage" --repo "$GITHUB_REPOSITORY" --clobber

  installer:
    needs: build
    uses: ./.github/workflows/installer.yml
    with:
      tag: ${{ github.event.release.tag_name || inputs.tag }}
