name: Release

# Publishing a release builds everything on GitHub: camallo.exe for Windows (MSVC) from the tag, the portable
# camallo-<version>-windows-x64.7z attached to the release, and then the setup (see installer.yml).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.6.3)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Build camallo.exe
        run: cargo build --release --locked

      - name: Pack it and attach it to the release
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target\release\camallo.exe dist\
          Push-Location dist
          7z a "..\camallo-$version-windows-x64.7z" camallo.exe
          if ($LASTEXITCODE -ne 0) { throw "7z failed" }
          Pop-Location
          gh release upload $env:TAG "camallo-$version-windows-x64.7z" --repo $env:GITHUB_REPOSITORY --clobber

  installer:
    needs: build
    uses: ./.github/workflows/installer.yml
    with:
      tag: ${{ github.event.release.tag_name || inputs.tag }}
