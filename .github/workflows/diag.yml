name: Diag

on:
  push:
    paths: ['.github/workflows/diag.yml']

permissions:
  contents: read

jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev xvfb libgl1-mesa-dri libegl1 libxkbcommon-x11-0 ffmpeg python3 strace
          dpkg -l | grep -E 'libwebkit2gtk-4.1-0|libsoup-3|libgtk-3-0|libglib2.0-0 |mesa' | awk '{print $2, $3}'
      - name: Build the browser program
        run: cargo build --release --locked --bin camallo-browser
      - name: Where it waits
        run: |
          echo "--- environment"; env | grep -E 'XDG|DBUS|DISPLAY|GDK|GTK|HOME|WEBKIT' | sort
          ls -ld "${XDG_RUNTIME_DIR:-/nonexistent}" || true
          ls /usr/lib/x86_64-linux-gnu/webkit2gtk-4.1/ || true
          export WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1
          xvfb-run -a bash -c 'timeout 12 strace -f -tt -o /tmp/st.txt target/release/camallo-browser about:blank /tmp/prof >/tmp/o.txt 2>/tmp/e.txt; true' || true
          echo "--- execve of helpers"; grep -E 'execve\(' /tmp/st.txt | grep -vE 'ENOENT' | cut -c1-200 | head -10
          echo "--- last 40 lines of the trace"; tail -40 /tmp/st.txt | cut -c1-200
          echo "--- connect() to unix sockets"; grep -E 'connect\(.*AF_UNIX' /tmp/st.txt | cut -c1-200 | head -15
