name: Diag

on:
  push:
    paths: ['.github/workflows/diag.yml']

permissions:
  contents: read

jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev xvfb libgl1-mesa-dri libegl1 libxkbcommon-x11-0 ffmpeg python3 strace
          dpkg -l | grep -E 'libwebkit2gtk-4.1-0|libsoup-3|libgtk-3-0|libglib2.0-0 |mesa' | awk '{print $2, $3}'
      - name: Build the browser program
        run: cargo build --release --locked --bin camallo-browser
      - name: Where it waits
        run: |
          sudo apt-get install -y gdb >/dev/null 2>&1 || true
          export WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1
          echo "--- main thread, last syscalls"
          xvfb-run -a bash -c 'timeout 12 strace -f -tt -o /tmp/st.txt target/release/camallo-browser about:blank /tmp/prof >/tmp/o.txt 2>/tmp/e.txt; true' || true
          P=$(head -1 /tmp/st.txt | awk '{print $1}')
          awk -v p="$P" '$1==p' /tmp/st.txt | tail -25 | cut -c1-210
          echo "--- processes started"; grep -cE 'execve\(' /tmp/st.txt; grep -E 'clone3?\(' /tmp/st.txt | wc -l
          echo "--- stacks of all threads"
          xvfb-run -a bash -c 'target/release/camallo-browser about:blank /tmp/prof >/tmp/o.txt 2>/tmp/e.txt & P=$!; sleep 8; gdb -p $P -batch -ex "thread apply all bt 14" 2>&1 | grep -E "^(Thread|#)" | cut -c1-190 | head -120; kill $P' || true
