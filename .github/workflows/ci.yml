name: CI

# Every push builds camallo.exe and the Linux AppImage the way a release does, runs the tests and checks the
# formatting. The exe and the AppImage are kept for a week as artifacts, to try them before a release is made.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: camallo-windows-x64
          path: target/release/camallo.exe
          retention-days: 7

  linux-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Libraries of the browser window
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
      - name: Test
        run: cargo test --locked

  # Built on the oldest Ubuntu still offered, so the AppImage runs on anything newer than that.
  linux-appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev xvfb libgl1-mesa-dri libegl1 libxkbcommon-x11-0 ffmpeg python3
      - name: Build
        run: cargo build --release --locked
      - name: Pack the AppImage
        run: packaging/linux/build-appimage.sh "0.0.0-ci" target/release dist
      - name: The main program needs neither GTK nor WebKitGTK to start
        run: |
          chmod +x dist/*.AppImage
          cd dist && ./camallo-0.0.0-ci-linux-x86_64.AppImage --appimage-extract >/dev/null && cd ..
          ldd dist/squashfs-root/usr/bin/camallo
          ! ldd dist/squashfs-root/usr/bin/camallo | grep -Ei 'webkit|gtk'
      - name: Start it
        # A window needs a display and a GL driver; the program is still running after 15 seconds if it came up.
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1 HOME="$RUNNER_TEMP/home" XDG_DATA_HOME="$RUNNER_TEMP/home/data"
          mkdir -p "$HOME"
          code=0
          timeout 15 xvfb-run -a dist/camallo-0.0.0-ci-linux-x86_64.AppImage || code=$?
          echo "exit code: $code"
          test "$code" = 124
      - name: The browser finds a video
        # The browser program from inside the AppImage opens a page with a video and reports it.
        run: xvfb-run -a packaging/linux/check-browser.sh dist/squashfs-root/usr/bin/camallo-browser
      - run: rm -rf dist/squashfs-root
      - uses: actions/upload-artifact@v4
        with:
          name: camallo-linux-x86_64-appimage
          path: dist/*.AppImage
          retention-days: 7

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
